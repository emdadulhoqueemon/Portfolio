<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Emdadul Hoque Emon — Visual Designer · Video Editor · Creative Content Creator</title>
<meta name="description" content="Editorial portfolio of Emdadul Hoque Emon — short-form video editing, poster & graphic design, and Dawah/Islamic visual content." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Ambient gradient-wave layer -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient__wave ambient__wave--a"></div>
    <div class="ambient__wave ambient__wave--b"></div>
    <div class="ambient__wave ambient__wave--c"></div>
  </div>

  <!-- Header -->
  <header class="site-head" id="site-head">
    <div class="site-head__inner">
      <a class="brand" href="#/" data-nav aria-label="Home">
        <span class="brand__avatar" aria-hidden="true">
          <img src="assets/avatar.svg" alt="" width="44" height="44" />
        </span>
        <span class="brand__text">
          <span class="brand__name">Emdadul Hoque Emon</span>
          <span class="brand__role">Visual Designer · Video Editor · Content Creator</span>
        </span>
      </a>
      <button class="hamburger" id="hamburger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
        <span class="hamburger__box" aria-hidden="true">
          <span class="hamburger__line"></span>
          <span class="hamburger__line"></span>
          <span class="hamburger__line"></span>
        </span>
        <span class="hamburger__label">Menu</span>
      </button>
    </div>
  </header>

  <!-- Side drawer -->
  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer__backdrop" id="drawer-backdrop"></div>
    <aside class="drawer__panel" role="dialog" aria-modal="true" aria-label="Site menu">
      <div class="drawer__head">
        <span class="drawer__title">Index</span>
        <button class="drawer__close" id="drawer-close" type="button" aria-label="Close menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>

      <nav class="drawer__nav" aria-label="Primary">
        <a class="drawer__link drawer__link--home" href="#/" data-nav>Home</a>
        <a class="drawer__link" href="#/work" data-nav>Work <span class="drawer__count" id="drawer-work-count"></span></a>
        <a class="drawer__link drawer__link--flagship" href="#/fath-makkah" data-nav>Fath Makkah <span class="drawer__flag">Flagship</span></a>
        <a class="drawer__link" href="#/islamic-corner" data-nav>Islamic Corner</a>
        <a class="drawer__link" href="#/prompts" data-nav>Prompt Archive</a>
        <a class="drawer__link" href="#/about" data-nav>About</a>
        <a class="drawer__link" href="#/contact" data-nav>Contact</a>
      </nav>

      <div class="drawer__section">
        <span class="drawer__label">Disciplines</span>
        <nav class="drawer__cats" id="drawer-cats" aria-label="Categories"></nav>
      </div>

      <div class="drawer__foot">
        <nav class="drawer__socials" id="drawer-socials" aria-label="Social"></nav>
        <a class="drawer__email" id="drawer-email" href=""></a>
      </div>
    </aside>
  </div>

  <!-- Main view -->
  <main id="main" class="view" tabindex="-1"></main>

  <!-- Footer -->
  <footer class="site-foot">
    <div class="site-foot__inner">
      <span class="site-foot__mark">Emdadul Hoque Emon</span>
      <span class="site-foot__note">Visual Designer · Video Editor · Creative Content Creator</span>
      <nav class="site-foot__socials" id="foot-socials" aria-label="Social"></nav>
      <span class="site-foot__legal">© 2026 Emdadul Hoque Emon</span>
    </div>
  </footer>

  <!-- Modal root (project details / video / e-book reader) -->
  <div class="modal-root" id="modal-root" aria-hidden="true"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
